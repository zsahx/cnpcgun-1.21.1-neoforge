plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

group = 'bincnpc'
version = '1.1.1'
base {
    archivesName = 'cnpcgun-1.21.1-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// access transformers can be added later via minecraft.accessTransformers.file

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'cnpcgun'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'cnpcgun'
        programArgument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    flatDir { dirs 'libs' }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.209"

    compileOnly files('libs/customnpcs-1.21.1.jar')
    compileOnly files('libs/playeranimator-1.21.1.jar')
    compileOnly files('libs/tacz-1.21.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '5000']

    // The dependency mod jars are not redistributed with this repository; fail with a readable hint
    // instead of a wall of "package does not exist" errors.
    doFirst {
        def required = ['customnpcs-1.21.1.jar', 'playeranimator-1.21.1.jar', 'tacz-1.21.1.jar']
        def missing = required.findAll { !file("libs/${it}").exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing dependency jar(s) in libs/: ${missing.join(', ')}\n" +
                "Download the versions listed in README.md and place them in libs/ (compile-only, not packaged)."
            )
        }
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'cnpcgun',
            'Specification-Vendor'    : 'XiaoBiniaoX',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'XiaoBiniaoX'
        ])
    }
}
